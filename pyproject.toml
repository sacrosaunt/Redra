[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "redra-mcp"
version = "0.1.0"
description = "An open MCP server for searching class-action settlement data"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Redra contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.27,<2",
  "pydantic>=2.8,<3",
  "uvicorn>=0.31,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[project.scripts]
redra-mcp = "redra_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
